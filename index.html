/* Idée : un guide de voyage aux couleurs de la carte de la région (mer, prairie, sable, points rouges des villes).
   Rail de navigation à gauche, recherche toujours visible, fiches dans un tiroir. */
:root{
 --bg:#eef3ee;--surface:#ffffff;--surface2:#f5f8f4;--ink:#16282b;--muted:#566869;--line:#d3ddd5;
 --sea:#17757c;--sea-soft:#dbeeec;--marker:#c22f47;--grass:#2f7d48;--sand:#f2e6c4;--gold:#9a6a00;
 --shadow:0 1px 2px #16282b14,0 6px 18px #16282b0f;
 --display:"Outfit","Trebuchet MS",Verdana,sans-serif;--body:"Atkinson Hyperlegible","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
 --rail:248px;--head:60px;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#0e1a1d;--surface:#15262a;--surface2:#1a2f33;--ink:#e6efec;--muted:#93a8a6;--line:#294045;
 --sea:#5cc6c4;--sea-soft:#17383c;--marker:#f26a80;--grass:#73c98c;--sand:#3a3524;--gold:#e6b84d;
 --shadow:0 1px 2px #0006,0 8px 22px #0005;color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#0e1a1d;--surface:#15262a;--surface2:#1a2f33;--ink:#e6efec;--muted:#93a8a6;--line:#294045;
 --sea:#5cc6c4;--sea-soft:#17383c;--marker:#f26a80;--grass:#73c98c;--sand:#3a3524;--gold:#e6b84d;
 --shadow:0 1px 2px #0006,0 8px 22px #0005;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--body)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--sea)}
img{max-width:100%}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.15;text-wrap:balance;letter-spacing:.01em}
:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
body.lock{overflow:hidden}

/* rail */
#rail{position:fixed;inset:0 auto 0 0;width:var(--rail);background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:14px;padding:18px 12px;overflow-y:auto;z-index:30}
.brand{display:flex;gap:10px;align-items:center;padding:2px 6px 14px;border-bottom:2px dashed var(--line);background:none;border-width:0 0 2px;text-align:left;width:100%}
.brand i{flex:0 0 38px;height:38px;border-radius:50%;background:linear-gradient(var(--marker) 0 46%,var(--ink) 46% 54%,var(--surface2) 54%);border:3px solid var(--ink);position:relative}
.brand i::after{content:'';position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-8px;border-radius:50%;background:var(--surface);border:3px solid var(--ink)}
.brand b{display:block;font:700 21px/1 var(--display)}
.brand small{color:var(--muted);font-size:12px}
nav{display:flex;flex-direction:column;gap:2px}
.nv{display:flex;align-items:center;gap:10px;padding:9px 10px;border:0;background:none;border-radius:8px;text-align:left;font-weight:700;font-size:15px;color:var(--ink)}
.nv span{flex:0 0 22px;text-align:center;color:var(--muted)}
.nv:hover{background:var(--surface2)}
.ng{font:700 11px var(--body);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);padding:10px 10px 3px}
@media(min-width:821px){#nav.grp .nv{padding:5px 10px}#nav.grp .ng{padding-top:9px}}
.nv.on{background:var(--sea-soft);color:var(--sea)}
.nv.on span{color:var(--sea)}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.rail-foot button{padding:7px 10px;border:1px solid var(--line);background:var(--surface2);border-radius:8px;text-align:left;font-size:14px}
.rail-foot button:hover{border-color:var(--sea)}

/* page */
#page{margin-left:var(--rail);padding:0 clamp(16px,3vw,40px) 80px}
#top{position:sticky;top:0;z-index:20;height:var(--head);display:flex;align-items:center;gap:14px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);margin:0 calc(-1*clamp(16px,3vw,40px));padding:0 clamp(16px,3vw,40px);border-bottom:1px solid var(--line)}
#crumb{font:700 18px var(--display);white-space:nowrap}
.search{position:relative;margin-left:auto;flex:0 1 360px}
.search input{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
#res{position:absolute;inset:calc(100% + 4px) 0 auto 0;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);max-height:60vh;overflow:auto;display:none;padding:4px}
#res.on{display:block}
#res button{display:flex;gap:10px;width:100%;padding:8px 10px;border:0;background:none;border-radius:6px;text-align:left}
#res button:hover,#res button:focus-visible{background:var(--sea-soft)}
#res small{display:block;color:var(--sea);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
#res button>span{display:flex;flex-direction:column;min-width:0}#res em{font-style:normal;font-size:13px;color:var(--muted);overflow-wrap:anywhere}#res mark{background:var(--sand);color:inherit;border-radius:2px}
#res .tom{border-top:1px solid var(--line);border-radius:0 0 6px 6px;color:var(--sea);font-weight:700}#res p{padding:10px;color:var(--muted)}
.rb{display:none}.fwrap{display:contents}@media(min-width:821px){.only-m{display:none!important}}
.flash{animation:flash 2.2s ease-out}@keyframes flash{0%,35%{box-shadow:0 0 0 3px var(--gold)}100%{box-shadow:0 0 0 3px transparent}}
.cvz{border:0;padding:0;background:none;cursor:zoom-in;display:block;width:100%}
.dh .lk{margin-top:6px}
main{max-width:1180px;margin:22px auto 0;display:flex;flex-direction:column;gap:18px}
.head h2{font-size:clamp(26px,3vw,36px)}
.head p{color:var(--muted);max-width:68ch;margin-top:4px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;box-shadow:var(--shadow)}
.panel>h3{font-size:22px;margin-bottom:10px}
.sec{display:flex;align-items:center;gap:10px;font:700 14px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-top:6px}
.sec::after{content:'';flex:1;border-top:2px dashed var(--line)}
.row{display:flex;flex-wrap:wrap;gap:10px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}
.txt{white-space:pre-line;overflow-wrap:anywhere}
ul.pts{list-style:none;display:flex;flex-direction:column;gap:8px}
ul.pts li{padding-left:18px;position:relative;white-space:pre-line;overflow-wrap:anywhere}
ul.pts li::before{content:'';position:absolute;left:2px;top:.62em;width:7px;height:7px;background:var(--sea);border-radius:2px;transform:rotate(45deg)}
ul.pts .ept{display:inline-block;margin:0 .5em 0 0;padding:0 .5em;border:1px solid var(--line);border-radius:999px;background:var(--surface2);color:var(--muted);font:inherit;font-size:.78em;line-height:1.55;white-space:nowrap;vertical-align:.1em;font-variant-numeric:tabular-nums}
ul.pts button.ept{cursor:pointer}ul.pts button.ept:hover,ul.pts button.ept:focus-visible{color:var(--ink);border-color:var(--sea)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface2);font-size:14px;line-height:1.3;text-decoration:none;color:var(--ink)}
button.chip:hover,a.chip:hover{border-color:var(--sea);color:var(--sea)}
.chip.on{background:var(--sea);border-color:var(--sea);color:var(--surface)}button.chip.on:hover{color:var(--surface)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;border:2px solid var(--ink);background:var(--surface);font-weight:700;text-decoration:none;color:var(--ink);box-shadow:2px 2px 0 var(--ink)}
.btn:hover{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
.btn.pri{background:var(--marker);border-color:var(--ink);color:#fff}
.btn.sm{padding:4px 10px;font-size:14px;border-width:1px;box-shadow:none}
.ty{display:inline-block;padding:1px 8px;border-radius:4px;font:700 12px var(--body);letter-spacing:.04em;text-transform:uppercase;color:#fff;background:#667;white-space:nowrap}
.tblw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:6px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
tr:last-child td{border-bottom:0}
td:first-child{font-weight:700;min-width:7.5em}
.num{font-variant-numeric:tabular-nums}
.edit{display:none}
body.mod .edit{display:inline-flex}

/* cartes personnage */
.pc{width:138px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;text-align:center}
.pc:hover{border-color:var(--sea);box-shadow:var(--shadow)}
.av{width:72px;height:72px;border-radius:50%;border:3px solid var(--c,var(--line));background:var(--surface2);display:grid;place-items:center;overflow:hidden;font:700 26px var(--display);color:var(--muted);flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.av img.spr{width:76%;height:76%;object-fit:contain;image-rendering:pixelated}
.pc b{font-size:14px;line-height:1.25;overflow-wrap:anywhere}
.tt{font-weight:400;color:var(--muted)}h2 .tt,h3 .tt{font-weight:600;color:inherit;opacity:.6}
.pc .cl{font:700 10.5px var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--sea);margin:0 -8px -4px}
.pc small{font-size:12px;color:var(--muted);line-height:1.25;overflow-wrap:anywhere}
.pc.big{width:170px;padding:16px 10px}
.pc.big .av{width:104px;height:104px;position:relative;overflow:visible}
.pc.big .av>img:first-child{border-radius:50%}
.pc.big .em{position:absolute;right:-10px;bottom:-8px;width:44px;height:44px;border-radius:50%;background:var(--surface);border:2px solid var(--c);display:grid;place-items:center}
.pc.big .em img{width:34px;height:34px;object-fit:contain;image-rendering:pixelated}
.pc.big b{font:700 20px var(--display)}
.dots{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.dots i{width:12px;height:12px;border-radius:50%;border:1px solid var(--ink)}
.dots i.ko{background:none!important;border-style:dashed;border-color:var(--marker)}

/* pokémon */
.pk{display:flex;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface2)}
.th{flex:0 0 60px;width:60px;height:60px;border-radius:8px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;position:relative;font:700 20px var(--display);color:var(--muted)}
.th img{max-width:52px;max-height:52px;image-rendering:pixelated}
.spr{height:auto;aspect-ratio:1;image-rendering:pixelated}
.th.fu img{position:absolute;max-width:34px;max-height:34px}.th.fu img:first-child{left:2px;top:3px}.th.fu img:last-child{right:2px;bottom:3px}
.pk .b{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.pk .nk{font:700 17px var(--display);color:var(--marker)}
.pk .mv{display:flex;flex-wrap:wrap;gap:4px}
.pk .mv span{font-size:13px;padding:1px 7px;border:1px solid var(--line);border-radius:5px;background:var(--surface)}
.mv .mvb{font:inherit;font-size:13px;text-align:left;padding:1px 7px;border:1px solid var(--line);border-radius:5px;background:var(--surface);color:inherit;cursor:pointer}
.mv .mvb i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}.mv .mvb em{font-style:normal;color:var(--muted);font-size:12px}
.mvt{font:inherit;color:inherit;background:none;border:0;border-bottom:1px dotted var(--muted);padding:0;cursor:pointer;text-align:left}
.mvb:hover,.mvb:focus-visible{border-color:var(--sea)}.mvt:hover,.mvt:focus-visible{border-bottom-color:var(--sea);color:var(--sea)}
.sx{font-weight:700;margin-left:2px}.sx.f{color:#c2478a}.sx.m{color:#2f77d6}
#capPop{position:fixed;z-index:55;display:none;box-sizing:border-box;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-top:3px solid var(--sea);border-radius:10px;padding:12px 14px;box-shadow:0 12px 32px #0005;font-size:15px;line-height:1.45}
#capPop.on{display:block}#capPop .cph{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}#capPop .cph b{font-size:17px}
#capPop .x{border:0;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);padding:0 2px}
#capPop .cpt{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0 2px}#capPop .cpn{display:flex;gap:18px;margin:8px 0 2px}#capPop .cpn span{display:flex;flex-direction:column}#capPop .cpn small{color:var(--muted);font-size:12px}#capPop .cpn b{font-variant-numeric:tabular-nums}
#capPop p{margin:8px 0}
#capPop p.rs{margin:10px 0 4px}
#capPop p.ef{margin:4px 0 8px;color:var(--muted);font-size:14px}#capPop .src{display:block;color:var(--muted);font-size:12.5px;border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
#capPop .lk{border:0;background:none;padding:0;font:inherit;color:inherit;text-decoration:underline;cursor:pointer}
table.cap td,table.cap th{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
table.cap th .sh{font:inherit;font-weight:inherit;text-transform:inherit;letter-spacing:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;white-space:nowrap}table.cap td .rs{display:block}table.cap td .ef{display:block;margin-top:2px;color:var(--muted);font-size:.93em}
table.cap th .ar{margin-left:5px;font-size:.78em;color:var(--muted)}

/* relations : « Nom | lien ». Le nom écrit est cherché parmi les noms complets (nom + nom de famille), puis parmi les noms seuls, puis par inclusion.

function relList(nom,own,key){const P=people(),f=fold(nom);const find=n=>{const x=fold(n);return P.find(p=>p.ff===x)||P.find(p=>fold(p.nom)===x)||P.find(p=>p.al&&p.al.includes(x))||(x.length>3&&(P.find(p=>p.ff.includes(x))||P.find(p=>fold(p.nom).includes(x))))||undefined};const out=[];

function ltqOf(p){const n=String(p.nom||'').trim(),L=[],par=/\s*\([^)]*\)/g;
  const add=x=>{x=String(x||'').replace(/[«»"“”|]/g,' ').replace(/\s+/g,' ').trim();if(fold(x).replace(/[^a-z0-9]/g,'').length>=3&&!L.some(y=>fold(y)===fold(x)))L.push(x)};

let fseq=0;
function field(def,val,path){const [k,lab,t,opt]=def;const id='f'+(++fseq);const a=`id="${id}" data-f="${esc(k)}" data-t="${t}"`;const help=typeof opt==='string'?`<small>${esc(opt)}</small>`:'';

  if(t==='area')return `<div class="f">${L}<textarea ${a} rows="5">${esc(val??'')}</textarea>${help}</div>`;

  if(t==='gal')return `<div class="f">${L}<textarea ${a.replace('data-t="gal"','data-t="lines"')} rows="8">${esc((val||[]).join('\n'))}</textarea><div><label class="btn sm" style="cursor:pointer">Ajouter des images depuis l'ordinateur<input type="file" accept="image/*" multiple data-many="${id}" hidden></label></div>${help}<small>Les images choisies sont envoyées sur le dépôt à l'enregistrement (4 Mo maximum chacune). Les adresses d'images déjà en ligne (NoelShack…) fonctionnent aussi.</small></div>`;
  if(t==='paras')return `<div class="f">${L}<textarea ${a} rows="7">${esc((val||[]).join('\n\n'))}</textarea>${help}</div>`;
  if(t==='raw')return `<div class="f">${L}<textarea ${a} rows="4">${esc((val||[]).map(p=>typeof p==='string'?p:p.raw||'').join('\n'))}</textarea>${help}</div>`;
  if(t==='csv')return `<div class="f">${L}<input ${a} value="${esc((val||[]).join(', '))}"></div>`;
  if(t==='kv')return `<div class="f">${L}<textarea ${a} rows="6">${esc(Object.entries(val||{}).map(([x,y])=>x+' : '+y).join('\n'))}</textarea>${help}</div>`;

  if(t==='color')return `<div class="f">${L}<input type="color" ${a} value="${esc(val||'#17757c')}"></div>`;
  if(t==='select')return `<div class="f">${L}<select ${a}>${opt().map(([v,n])=>`<option value="${esc(v)}"${v===(val??'')?' selected':''}>${esc(n)}</option>`).join('')}</select></div>`;
  if(t==='img')return `<div class="f">${L}<div class="row" style="align-items:center"><input ${a} value="${esc(val??'')}" placeholder="chemin du fichier ou adresse https://…" style="flex:1;min-width:180px"><label class="btn sm" style="cursor:pointer">Choisir une image<input type="file" accept="image/*" data-up="${id}"${opt==='raw'?' data-raw':''} hidden></label></div><small>${opt==='raw'?'L\'image est envoyée telle quelle (4 Mo maximum)':'L\'image choisie est recadrée en carré, réduite,'} puis envoyée sur le dépôt à l'enregistrement.</small></div>`;
  if(t==='pos')return `<div class="f"><label>${esc(lab)}</label><div class="row" style="align-items:center"><input id="${id}x" data-f="x" data-t="num" value="${esc(path.x??50)}" style="width:90px" aria-label="X en %"><input id="${id}y" data-f="y" data-t="num" value="${esc(path.y??50)}" style="width:90px" aria-label="Y en %"><button type="button" class="btn sm" data-pick="${id}">Placer en cliquant sur la carte</button></div><small>En pourcentage de la largeur et de la hauteur de la carte.</small></div>`;
  if(t==='sub')return `<div class="f"><label>${esc(lab)}</label><div class="stack" data-sub="${esc(k)}">${(val||[]).map(v=>subItem(def,v)).join('')}</div><div><button type="button" class="btn sm" data-subadd="${esc(k)}">+ Ajouter</button></div></div>`;
  return ''}
function subItem(def,v){if(typeof v==='string')v={raw:v};return `<div class="sub" data-item><div class="h"><span>${esc(v.nom||v.nick||v.esp||v.niveau||v.t||v.raw||'Nouveau')}</span><span style="margin-left:auto"></span><button type="button" class="btn sm" data-up1>↑</button><button type="button" class="btn sm" data-rm>Retirer</button></div>${def[3].map(d=>field(d,v[d[0]],v)).join('')}</div>`}
function readFields(root){const o={};const kids=[...root.children].flatMap(c=>c.matches('.f')?[c]:[]);

    if(sub){o[sub.dataset.sub]=[...sub.children].filter(c=>c.matches('[data-item]')).map(readFields);continue}
    for(const el of f.querySelectorAll('[data-f]')){if(el.closest('[data-item]')!==root.closest('[data-item]')&&el.closest('[data-item]')!==root)continue;const t=el.dataset.t,v=el.value;const k=el.dataset.f;
      o[k]=t==='lines'?v.split('\n').map(x=>x.trim()).filter(Boolean):t==='paras'?v.split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean):t==='raw'?v.split('\n').map(x=>x.trim()).filter(Boolean).map(x=>({raw:x})):

  return o}

$('#md').addEventListener('click',e=>{const t=e.target;
  if(t.dataset.rm!==undefined)return t.closest('[data-item]').remove();
  if(t.dataset.up1!==undefined){const it=t.closest('[data-item]');if(it.previousElementSibling)it.parentNode.insertBefore(it,it.previousElementSibling);return}

    $('#map').addEventListener('click',ev=>{ev.stopPropagation();const r=$('#mapI').getBoundingClientRect();$('#'+t.dataset.pick+'x').value=((ev.clientX-r.left)/r.width*100).toFixed(2);$('#'+t.dataset.pick+'y').value=((ev.clientY-r.top)/r.height*100).toFixed(2);

function findDef(btn){const k=btn.dataset.subadd;let defs=SCH[FORM.coll].f;const chain=[];let n=btn.closest('.f');while(n){const s=n.querySelector(':scope > [data-sub]');if(s)chain.unshift(s.dataset.sub);n=n.parentElement&&n.parentElement.closest('.f')}

$('#md').addEventListener('change',e=>{const t=e.target;
  if(t.dataset.many){const ta=$('#'+t.dataset.many);const fs=[...t.files].sort((x,y)=>x.name.localeCompare(y.name,'fr',{numeric:true}));const rd=f=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)});
    (async()=>{let n=0;for(const file of fs){if(file.size>4e6){toast('« '+file.name+' » dépasse 4 Mo : ignorée.');continue}const base=file.name.replace(/\.[^.]+$/,'');const path='galerie/'+slug(base)+'-'+(Date.now()+n).toString(36)+'.'+(file.name.split('.').pop()||'png').toLowerCase();uploads[path]=(await rd(file)).split(',')[1];ta.value=(ta.value.trim()?ta.value.trim()+'\n':'')+path+' | '+base.replace(/^\d+[ ._-]+/,'');n++}if(n)toast(n+' image(s) prête(s) : elles seront envoyées à l\'enregistrement.');t.value=''})();return}

  if(t.dataset.raw!==undefined){if(file.size>4e6)return toast('Image trop lourde (4 Mo maximum).');const fr=new FileReader();fr.onload=()=>{const path='img/'+slug(file.name.replace(/\.[^.]+$/,''))+'-'+Date.now().toString(36)+'.'+(file.name.split('.').pop()||'png').toLowerCase();uploads[path]=fr.result.split(',')[1];$('#'+t.dataset.up).value=path;toast('Image prête : elle sera envoyée à l\'enregistrement.')};fr.readAsDataURL(file);return}const im=new Image();im.onload=()=>{const s=Math.min(im.width,im.height),c=document.createElement('canvas');c.width=c.height=Math.min(320,s);
  c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)*.3,s,s,0,0,c.width,c.height);const url=c.toDataURL('image/webp',.85);const path='portraits/'+slug(file.name.replace(/\.[^.]+$/,''))+'-'+Date.now().toString(36)+'.webp';
  uploads[path]=url.split(',')[1];$('#'+t.dataset.up).value=path;toast('Image prête : elle sera envoyée à l\'enregistrement.')};im.src=URL.createObjectURL(file)});
async function versGroupe(val,tg,msg){const err=$('#fErr');err.textContent='Enregistrement…';$('#fSave').disabled=true;
  try{for(const p of Object.keys(uploads)){if(JSON.stringify(val).includes(p))await gh(`/repos/${GH.repo}/contents/${p}`,{method:'PUT',body:JSON.stringify({message:'Image : '+p,content:uploads[p],branch:GH.branch||undefined})});delete uploads[p]}
    const f=await ghData(),N=f.data;if(!FORM.isNew){const i=N.persos.findIndex(x=>String(x.id)===String(FORM.id));if(i<0)throw new Error('Cette fiche a été supprimée entre-temps par quelqu\'un d\'autre.');N.persos.splice(i,1)}
    let id=slug(val.nom||'fiche'),n=2;while(N.groupe.some(x=>x.id===id))id=slug(val.nom)+'-'+n++;
    const pris=N.groupe.map(x=>(x.couleur||'').toLowerCase()),coul=['#b0563c','#6b8e23','#7a5c99','#2f8f83','#a0522d','#d1495b','#4a7c9b','#9b6a2f'].find(c=>!pris.includes(c))||'#7a5c99';
    const g={...blank(SCH.groupe.f),id,nom:val.nom,groupe:tg,img:val.img||'',couleur:coul,infos:val.sous?[val.sous]:[],bio:val.bio||[],equipe:val.equipe||[],relations:val.relations||[],appart:val.appart||[],images:val.images||[],extras:val.extras||''};
    let k=-1;N.groupe.forEach((x,j)=>{if((x.groupe||'Groupe principal')===tg)k=j});N.groupe.splice(k<0?N.groupe.length:k+1,0,g);
    (N.journal=N.journal||[]).push({d:new Date().toISOString(),par:GH.login,action:'modif',cible:'Personnages › '+val.nom,champs:['Groupe'],msg:msg||('Passe dans « '+tg+' »'),coll:'groupe',ref:id,idx:null,avant:null});N.journal.slice(0,-30).forEach(x=>{delete x.avant});
    await gh(`/repos/${GH.repo}/contents/data.json`,{method:'PUT',body:JSON.stringify({message:`${val.nom} — passe dans ${tg}`,content:b64e(JSON.stringify(N,null,1)),sha:f.sha,branch:GH.branch||undefined})});
    D=N;refresh();closeForm();closeDr();go('groupe-'+id);toast(val.nom+' fait maintenant partie de « '+tg+' ».')}
  catch(x){err.textContent=x.message==='Failed to fetch'?'Connexion à GitHub impossible.':x.message;$('#fSave').disabled=false}}
async function save(mode){const s=SCH[FORM.coll],err=$('#fErr');let msg=$('#fMsg').value.trim();
  const val=mode==='del'?null:{...FORM.orig,...readFields($('#fRoot'))};
  if(val)s.f.forEach(d=>{if(d[2]==='sub')val[d[0]]=clean(val[d[0]])});
  if(val&&FORM.isNew&&s.idk==='id')delete val.id;
  const pos=$('#fPos')?Math.max(1,parseInt($('#fPos').value)||1)-1:null;const moved=!FORM.isNew&&!FORM.single&&pos!==null&&pos!==findIdx(FORM.coll,FORM.id);
  if(val&&s.idk==='id'&&!val.id){let id=slug(val[s.label]||'fiche'),n=2;while(D[FORM.coll].some(x=>x.id===id))id=slug(val[s.label])+'-'+n++;val.id=id}
  const champs=val?s.f.filter(d=>d[2]==='pos'?(val.x!==FORM.orig.x||val.y!==FORM.orig.y):nz(val[d[0]])!==nz(FORM.orig[d[0]])).map(d=>d[1].replace(/ \(.*/,'')):[];
  if(moved)champs.push('Position');
  const tg=FORM.coll==='persos'&&val?groupes().find(g=>slug(g)===slug(val.cat||'')):null;if(tg)return versGroupe(val,tg,msg);
  if(mode!=='del'&&!FORM.isNew&&!champs.length){err.textContent='Rien n\'a été modifié.';return}
  if(!msg)msg=mode==='del'?'Suppression':FORM.isNew?'Ajout':'Modification : '+champs.join(', ');
  err.textContent='Enregistrement…';$('#fSave').disabled=true;
  try{for(const p of Object.keys(uploads)){if(val&&JSON.stringify(val).includes(p))await gh(`/repos/${GH.repo}/contents/${p}`,{method:'PUT',body:JSON.stringify({message:'Image : '+p,content:uploads[p],branch:GH.branch||undefined})});delete uploads[p]}
    const f=await ghData(),N=f.data;let avant=null,idx=null;if(!FORM.single&&!N[FORM.coll])N[FORM.coll]=[];
    if(FORM.single){avant=N[FORM.coll];N[FORM.coll]=val}else if(FORM.isNew)N[FORM.coll].splice(Math.min(pos??1e9,N[FORM.coll].length),0,val);
    else{const i=s.idk?N[FORM.coll].findIndex(x=>String(x[s.idk])===String(FORM.id)):FORM.id;if(i<0||!N[FORM.coll][i])throw new Error('Cette fiche a été supprimée entre-temps par quelqu\'un d\'autre.');avant=N[FORM.coll][i];idx=i;if(mode==='del')N[FORM.coll].splice(i,1);else{N[FORM.coll][i]=val;if(moved){N[FORM.coll].splice(i,1);N[FORM.coll].splice(Math.min(pos,N[FORM.coll].length),0,val)}}}
    const cible=s.nom+(FORM.single?'':' › '+((val||FORM.orig)[s.label]||''));
    (N.journal=N.journal||[]).push({d:new Date().toISOString(),par:GH.login,action:mode==='del'?'suppr':FORM.isNew?'ajout':'modif',cible,champs,msg,coll:FORM.coll,ref:FORM.single?'':s.idk?(val||FORM.orig)[s.idk]:(FORM.isNew?N[FORM.coll].indexOf(val):FORM.id),idx,avant});
    N.journal.slice(0,-30).forEach(x=>{delete x.avant});
    await gh(`/repos/${GH.repo}/contents/data.json`,{method:'PUT',body:JSON.stringify({message:`${cible} — ${msg}`,content:b64e(JSON.stringify(N,null,1)),sha:f.sha,branch:GH.branch||undefined})});
    D=N;refresh();closeForm();closeDr();go(R[route]||/^(groupe|arene|info|org)-/.test(route)?route:'accueil');toast('Enregistré. Le site public se met à jour dans une minute environ.',6000)}
  catch(er){err.textContent=er.message==='Failed to fetch'?'Connexion à GitHub impossible.':er.message;$('#fSave').disabled=false}}
