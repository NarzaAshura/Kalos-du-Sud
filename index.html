<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Atlas de Kalos du Sud</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Idée : un guide de voyage aux couleurs de la carte de la région (mer, prairie, sable, points rouges des villes).
   Rail de navigation à gauche, recherche toujours visible, fiches dans un tiroir. */
:root{
 --bg:#eef3ee;--surface:#ffffff;--surface2:#f5f8f4;--ink:#16282b;--muted:#566869;--line:#d3ddd5;
 --sea:#17757c;--sea-soft:#dbeeec;--marker:#c22f47;--grass:#2f7d48;--sand:#f2e6c4;--gold:#9a6a00;
 --shadow:0 1px 2px #16282b14,0 6px 18px #16282b0f;
 --display:"Pixelify Sans","Trebuchet MS",Verdana,sans-serif;--body:"Atkinson Hyperlegible","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
 --rail:248px;--head:60px;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#0e1a1d;--surface:#15262a;--surface2:#1a2f33;--ink:#e6efec;--muted:#93a8a6;--line:#294045;
 --sea:#5cc6c4;--sea-soft:#17383c;--marker:#f26a80;--grass:#73c98c;--sand:#3a3524;--gold:#e6b84d;
 --shadow:0 1px 2px #0006,0 8px 22px #0005;color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#0e1a1d;--surface:#15262a;--surface2:#1a2f33;--ink:#e6efec;--muted:#93a8a6;--line:#294045;
 --sea:#5cc6c4;--sea-soft:#17383c;--marker:#f26a80;--grass:#73c98c;--sand:#3a3524;--gold:#e6b84d;
 --shadow:0 1px 2px #0006,0 8px 22px #0005;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--body)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--sea)}
img{max-width:100%}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.15;text-wrap:balance;letter-spacing:.01em}
:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
body.lock{overflow:hidden}

/* rail */
#rail{position:fixed;inset:0 auto 0 0;width:var(--rail);background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:14px;padding:18px 12px;overflow-y:auto;z-index:30}
.brand{display:flex;gap:10px;align-items:center;padding:2px 6px 14px;border-bottom:2px dashed var(--line);background:none;border-width:0 0 2px;text-align:left;width:100%}
.brand i{flex:0 0 38px;height:38px;border-radius:50%;background:linear-gradient(var(--marker) 0 46%,var(--ink) 46% 54%,var(--surface2) 54%);border:3px solid var(--ink);position:relative}
.brand i::after{content:'';position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-8px;border-radius:50%;background:var(--surface);border:3px solid var(--ink)}
.brand b{display:block;font:700 21px/1 var(--display)}
.brand small{color:var(--muted);font-size:12px}
nav{display:flex;flex-direction:column;gap:2px}
.nv{display:flex;align-items:center;gap:10px;padding:9px 10px;border:0;background:none;border-radius:8px;text-align:left;font-weight:700;font-size:15px;color:var(--ink)}
.nv span{flex:0 0 22px;text-align:center;color:var(--muted)}
.nv:hover{background:var(--surface2)}
.nv.on{background:var(--sea-soft);color:var(--sea)}
.nv.on span{color:var(--sea)}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.rail-foot button{padding:7px 10px;border:1px solid var(--line);background:var(--surface2);border-radius:8px;text-align:left;font-size:14px}
.rail-foot button:hover{border-color:var(--sea)}

/* page */
#page{margin-left:var(--rail);padding:0 clamp(16px,3vw,40px) 80px}
#top{position:sticky;top:0;z-index:20;height:var(--head);display:flex;align-items:center;gap:14px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);margin:0 calc(-1*clamp(16px,3vw,40px));padding:0 clamp(16px,3vw,40px);border-bottom:1px solid var(--line)}
#crumb{font:700 18px var(--display);white-space:nowrap}
.search{position:relative;margin-left:auto;flex:0 1 360px}
.search input{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
#res{position:absolute;inset:calc(100% + 4px) 0 auto 0;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);max-height:60vh;overflow:auto;display:none;padding:4px}
#res.on{display:block}
#res button{display:flex;gap:10px;width:100%;padding:8px 10px;border:0;background:none;border-radius:6px;text-align:left}
#res button:hover,#res button:focus-visible{background:var(--sea-soft)}
#res small{margin-left:auto;color:var(--muted);white-space:nowrap}
main{max-width:1180px;margin:22px auto 0;display:flex;flex-direction:column;gap:18px}
.head h2{font-size:clamp(26px,3vw,36px)}
.head p{color:var(--muted);max-width:68ch;margin-top:4px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;box-shadow:var(--shadow)}
.panel>h3{font-size:22px;margin-bottom:10px}
.sec{display:flex;align-items:center;gap:10px;font:700 14px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-top:6px}
.sec::after{content:'';flex:1;border-top:2px dashed var(--line)}
.row{display:flex;flex-wrap:wrap;gap:10px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}
.txt{white-space:pre-line;overflow-wrap:anywhere}
ul.pts{list-style:none;display:flex;flex-direction:column;gap:8px}
ul.pts li{padding-left:18px;position:relative;white-space:pre-line;overflow-wrap:anywhere}
ul.pts li::before{content:'';position:absolute;left:2px;top:.62em;width:7px;height:7px;background:var(--sea);border-radius:2px;transform:rotate(45deg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface2);font-size:14px;line-height:1.3;text-decoration:none;color:var(--ink)}
button.chip:hover,a.chip:hover{border-color:var(--sea);color:var(--sea)}
.chip.on{background:var(--sea);border-color:var(--sea);color:var(--surface)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;border:2px solid var(--ink);background:var(--surface);font-weight:700;text-decoration:none;color:var(--ink);box-shadow:2px 2px 0 var(--ink)}
.btn:hover{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
.btn.pri{background:var(--marker);border-color:var(--ink);color:#fff}
.btn.sm{padding:4px 10px;font-size:14px;border-width:1px;box-shadow:none}
.ty{display:inline-block;padding:1px 8px;border-radius:4px;font:700 12px var(--body);letter-spacing:.04em;text-transform:uppercase;color:#fff;background:#667;white-space:nowrap}
.tblw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:6px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
tr:last-child td{border-bottom:0}
td:first-child{font-weight:700;min-width:7.5em}
.num{font-variant-numeric:tabular-nums}
.edit{display:none}
body.mod .edit{display:inline-flex}

/* cartes personnage */
.pc{width:138px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;text-align:center}
.pc:hover{border-color:var(--sea);box-shadow:var(--shadow)}
.av{width:72px;height:72px;border-radius:50%;border:3px solid var(--c,var(--line));background:var(--surface2);display:grid;place-items:center;overflow:hidden;font:700 26px var(--display);color:var(--muted);flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.av img.spr{width:76%;height:76%;object-fit:contain;image-rendering:pixelated}
.pc b{font-size:14px;line-height:1.25;overflow-wrap:anywhere}
.pc small{font-size:12px;color:var(--muted);line-height:1.25;overflow-wrap:anywhere}
.pc.big{width:170px;padding:16px 10px}
.pc.big .av{width:104px;height:104px;position:relative;overflow:visible}
.pc.big .av>img:first-child{border-radius:50%}
.pc.big .em{position:absolute;right:-10px;bottom:-8px;width:44px;height:44px;border-radius:50%;background:var(--surface);border:2px solid var(--c);display:grid;place-items:center}
.pc.big .em img{width:34px;height:34px;object-fit:contain;image-rendering:pixelated}
.pc.big b{font:700 20px var(--display)}
.dots{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.dots i{width:12px;height:12px;border-radius:50%;border:1px solid var(--ink)}
.dots i.ko{background:none!important;border-style:dashed;border-color:var(--marker)}

/* pokémon */
.pk{display:flex;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface2)}
.th{flex:0 0 60px;width:60px;height:60px;border-radius:8px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;position:relative;font:700 20px var(--display);color:var(--muted)}
.th img{max-width:52px;max-height:52px;image-rendering:pixelated}
.th.fu img{position:absolute;max-width:34px;max-height:34px}.th.fu img:first-child{left:2px;top:3px}.th.fu img:last-child{right:2px;bottom:3px}
.pk .b{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.pk .nk{font:700 17px var(--display);color:var(--marker)}
.pk .mv{display:flex;flex-wrap:wrap;gap:4px}
.pk .mv span{font-size:13px;padding:1px 7px;border:1px solid var(--line);border-radius:5px;background:var(--surface)}
.pk small{color:var(--muted);font-size:14px}
.stack{display:flex;flex-direction:column;gap:8px}

/* accueil */
.home{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(240px,.7fr);gap:18px}
.home .panel{display:flex;flex-direction:column;gap:12px}
.home h2{font-size:clamp(30px,4vw,46px)}
.home .lead{font-size:18px}
.cover{border-radius:12px;overflow:hidden;border:1px solid var(--line);min-height:300px;background:#22a9b3 center/cover}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.tile{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-align:left}
.tile:hover{border-color:var(--sea);box-shadow:var(--shadow)}
.tile i{flex:0 0 36px;height:36px;border-radius:8px;display:grid;place-items:center;background:var(--sea-soft);color:var(--sea);font-style:normal;font-size:18px}
.tile b{display:block;font:700 18px var(--display)}
.tile small{color:var(--muted);font-size:14px;line-height:1.35;display:block}

/* carte */
.mapw{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,.8fr);gap:18px;align-items:start}
.map{position:relative;border:3px solid var(--ink);border-radius:10px;overflow:hidden;line-height:0;background:#2aa7b5}
.map img{width:100%;display:block}
.hs{position:absolute;transform:translate(-50%,-50%);width:28px;height:28px;border-radius:50%;border:0;background:none;padding:0}
.hs.route{width:22px;height:22px}
.hs::before{content:'';position:absolute;inset:0;border-radius:inherit;border:3px solid #fff;box-shadow:0 0 0 2px #000;opacity:0}
.hs.route::before{border-radius:5px}
.hs:hover::before,.hs:focus-visible::before{opacity:1}
.hs.sel::before{opacity:1;border-color:#ffd447;box-shadow:0 0 0 2px #000,0 0 0 7px #ffd44766}
.hs::after{content:attr(data-n);position:absolute;left:50%;bottom:calc(100% + 6px);transform:translateX(-50%);background:#16282b;color:#fff;font:14px/1.2 var(--body);padding:3px 8px;border-radius:5px;white-space:nowrap;opacity:0;pointer-events:none;z-index:2}
.hs:hover::after,.hs:focus-visible::after{opacity:1}
.hs[hidden]{display:none}
body.placing .map{cursor:crosshair;outline:4px solid var(--marker)}
#place{position:sticky;top:calc(var(--head) + 14px);max-height:calc(100vh - var(--head) - 28px);overflow:auto;display:flex;flex-direction:column;gap:12px}
#place h3{font-size:26px}
h4{font:700 12px var(--body);text-transform:uppercase;letter-spacing:.1em;color:var(--sea);margin-top:6px}
.gym{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:12px 12px 12px 18px;min-height:104px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-align:left;overflow:hidden}
.gym::before{content:'';position:absolute;inset:0 auto 0 0;width:6px;background:var(--c)}
.gym:hover{border-color:var(--c);box-shadow:var(--shadow)}
.gym b{font:700 19px var(--display)}
.gym small{color:var(--muted);font-size:13px}
.gyms{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.bd td,.bd th{text-align:center;padding:6px 4px}.bd td:first-child,.bd th:first-child{text-align:left}
.bd .ok{color:var(--grass);font-weight:700}.bd .no{color:var(--marker);font-weight:700}
.sect{border-left:6px solid var(--c)}
.seal{flex:0 0 56px;height:56px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font:700 14px var(--display)}
.poem{font:italic 17px/1.7 Georgia,serif;white-space:pre-line;border-left:4px solid var(--gold);padding:6px 0 6px 16px;max-width:60ch}
.gal{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.gal img{border-radius:8px;border:1px solid var(--line);display:block;width:100%}
details.arc{background:var(--surface);border:1px solid var(--line);border-radius:10px}
details.arc>summary{cursor:pointer;display:flex;gap:12px;align-items:baseline;padding:14px 18px;font:700 19px var(--display)}
details.arc>summary small{margin-left:auto;font:14px var(--body);color:var(--muted)}
details.arc>div{padding:0 18px 18px;display:flex;flex-direction:column;gap:10px}
.eps{display:flex;flex-wrap:wrap;gap:4px}
.eps a,.eps span{min-width:40px;text-align:center;padding:2px 6px;border:1px solid var(--line);border-radius:5px;background:var(--surface2);font-size:14px;text-decoration:none;color:var(--ink);font-variant-numeric:tabular-nums}
.eps a:hover{border-color:var(--sea);color:var(--sea)}
.eps a.x{border-color:var(--gold);color:var(--gold);font-weight:700}
.ex{font-size:14px;display:grid;grid-template-columns:auto 1fr;gap:2px 10px}
.ex b{text-align:right;color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
.jr{display:grid;grid-template-columns:150px 1fr;gap:4px 16px;padding:12px 0;border-bottom:1px solid var(--line)}
.jr:last-child{border:0}
.jr time{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.tag{display:inline-block;padding:0 7px;border-radius:4px;font:700 12px var(--body);text-transform:uppercase;letter-spacing:.05em;background:var(--sea-soft);color:var(--sea)}
.tag.add{background:color-mix(in srgb,var(--grass) 18%,var(--surface));color:var(--grass)}.tag.del{background:color-mix(in srgb,var(--marker) 16%,var(--surface));color:var(--marker)}
.warn{padding:10px 14px;border:1px solid var(--gold);border-radius:8px;background:var(--sand);font-size:15px}

/* tiroir + modale */
#ov{position:fixed;inset:0;background:#0009;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
#ov.on{opacity:1;pointer-events:auto}
#dr{position:fixed;inset:0 0 0 auto;width:min(580px,100vw);background:var(--surface);border-left:3px solid var(--ink);z-index:41;display:flex;flex-direction:column;transform:translateX(103%);transition:transform .22s}
#dr.on{transform:none}
.dh{display:flex;gap:14px;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line);background:var(--surface2)}
.dh .av{width:88px;height:88px}
.dh h3{font-size:26px;overflow-wrap:anywhere}
.dh small{color:var(--muted);display:block}
.dh .x{margin-left:auto;align-self:flex-start;flex:none;width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:20px}
.dt{display:flex;gap:4px;padding:0 16px;border-bottom:1px solid var(--line)}
.dt button{border:0;background:none;padding:11px 12px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent}
.dt button.on{color:var(--sea);border-color:var(--sea)}
.db{flex:1;overflow:auto;padding:18px 20px 60px;display:flex;flex-direction:column;gap:12px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 12px;font-size:15px}
.kv b{color:var(--muted);font-weight:400}
.bar{display:grid;grid-template-columns:140px 1fr 36px;gap:10px;align-items:center;font-size:15px}
.bar i{height:10px;border-radius:5px;background:var(--line);overflow:hidden;display:block}
.bar i::after{content:'';display:block;height:100%;width:var(--w);background:var(--sea)}
.bar.neg i::after{background:var(--marker)}
#md{position:fixed;inset:0;z-index:60;display:none;place-items:start center;overflow:auto;padding:24px 12px;background:#000a}
#md.on{display:grid}
.form{width:min(760px,100%);background:var(--surface);border:3px solid var(--ink);border-radius:12px;display:flex;flex-direction:column}
.form header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.form header h3{font-size:22px}
.form .fb{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.form footer{position:sticky;bottom:0;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 18px;border-top:1px solid var(--line);background:var(--surface2);border-radius:0 0 10px 10px}
.f{display:flex;flex-direction:column;gap:4px}
.f label{font-weight:700;font-size:14px}
.f small{color:var(--muted);font-size:13px}
.f input,.f select,.f textarea{padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg);width:100%}
.f textarea{min-height:92px;resize:vertical;line-height:1.45}
.f input[type=color]{padding:2px;height:38px;width:70px}
.f input[type=checkbox]{width:auto}
.sub{border:1px dashed var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface2)}
.sub>div.h{display:flex;align-items:center;gap:8px;font-weight:700}
.err{color:var(--marker);font-weight:700}
#modbar{position:fixed;left:calc(var(--rail) + 16px);bottom:14px;z-index:25;display:none;gap:10px;align-items:center;padding:8px 14px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:14px;box-shadow:var(--shadow)}
body.mod #modbar{display:flex}
#toast{position:fixed;right:16px;bottom:16px;z-index:70;padding:10px 16px;border-radius:8px;background:var(--ink);color:var(--bg);display:none;max-width:min(420px,90vw)}

.now{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0;padding:0;overflow:hidden}
.now>div{display:flex;gap:12px;align-items:center;padding:14px 18px;border-right:1px solid var(--line)}
.now>div:last-child{border:0}
.now i{font-style:normal;font-size:26px;width:34px;text-align:center}
.now small{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.now b{font:700 19px var(--display)}
.cg{display:flex;flex-direction:column;gap:4px;margin-top:2px}
.cg>span{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.mv span i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.mv span em{font-style:normal;color:var(--muted);font-size:12px}
.fx{font-size:13px;color:var(--muted)}
.lv{margin-left:auto;font:700 13px var(--body);color:var(--muted);white-space:nowrap}
.crumbs{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.who{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-weight:700;font-size:15px}
.who .av{width:34px;height:34px;border-width:2px;font-size:15px}
.who:hover{border-color:var(--sea)}.who.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hero2{display:flex;flex-wrap:wrap;gap:22px;align-items:center;padding:24px;border-radius:14px;border:1px solid var(--line);border-left:8px solid var(--c);background:linear-gradient(100deg,color-mix(in srgb,var(--c) 14%,var(--surface)),var(--surface) 62%);box-shadow:var(--shadow)}
.hero2 .av{width:132px;height:132px;border-width:4px;font-size:48px}
.hero2 h2{font-size:clamp(30px,4vw,46px)}
.hero2 .meta{display:flex;flex-direction:column;gap:8px;flex:1;min-width:240px}
.hero2 .em{width:84px;height:84px;display:grid;place-items:center;border-radius:14px;background:var(--surface2);border:1px solid var(--line)}
.hero2 .em img{width:72px;height:72px;object-fit:contain;image-rendering:pixelated}
.split{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(300px,.8fr);gap:18px;align-items:start}
.teamgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.wiki{display:grid;grid-template-columns:240px minmax(0,1fr);gap:22px;align-items:start}
.toc{position:sticky;top:calc(var(--head) + 14px);max-height:calc(100vh - var(--head) - 28px);overflow:auto;display:flex;flex-direction:column;gap:2px;padding:12px}
.toc b{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:10px 8px 4px}
.toc button{border:0;background:none;text-align:left;padding:6px 8px;border-radius:6px;font-size:15px;line-height:1.3}
.toc button:hover{background:var(--surface2)}.toc button.on{background:var(--sea-soft);color:var(--sea);font-weight:700}
.wiki .panel{max-width:none}.wiki .panel>.txt,.wiki ul.pts{max-width:78ch}
.hero{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:24px;align-items:center}
.hero h2{font-size:clamp(30px,4vw,46px)}.hero .lead{font-size:18px;max-width:62ch}
.hero .cv{border-radius:10px;border:1px solid var(--line);width:100%;aspect-ratio:1200/1700;object-fit:cover;display:block}
.cols3{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.last{font:700 clamp(28px,3.4vw,40px)/1.1 var(--display);color:var(--marker);text-decoration:none}
.last:hover{text-decoration:underline}
.mini{display:flex;align-items:center;gap:10px;padding:6px;border:0;background:none;border-radius:8px;text-align:left;width:100%}
.mini:hover{background:var(--surface2)}.mini .av{width:40px;height:40px;border-width:2px;font-size:16px}.mini b{flex:1}
.jmini{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}.jmini:last-of-type{border:0}.jmini small{color:var(--muted)}
.tiles.sm .tile{padding:10px 12px}.tiles.sm .tile small{display:none}
@media(max-width:1000px){.split,.wiki,.hero{grid-template-columns:1fr}.toc{position:static;max-height:none;flex-direction:row;flex-wrap:wrap}.toc b{flex-basis:100%}.hero .cv{max-width:220px}
.mapw,.home{grid-template-columns:1fr}#place{position:static;max-height:none}.cover{min-height:420px}}
@media(max-width:820px){
 #rail{position:static;width:auto;flex-direction:column;border-right:0;border-bottom:1px solid var(--line);padding:10px 12px;gap:8px}
 .brand{border:0;padding-bottom:0}nav{flex-direction:row;overflow-x:auto}.nv{white-space:nowrap}.rail-foot{flex-direction:row;margin:0}.rail-foot p{display:none}
 #page{margin-left:0}#crumb{display:none}.search{flex:1}#modbar{left:12px}
 .pc,.pc.big{width:calc(50% - 5px)}.kv{grid-template-columns:1fr}.jr{grid-template-columns:1fr}
}
</style></head><body>
<aside id="rail"><button class="brand" data-v="accueil"><i></i><span><b>Kalos du Sud</b><small>L'atlas de la fic</small></span></button>
<nav id="nav" aria-label="Sections"></nav>
<div class="rail-foot"><button data-v="journal">Journal des modifications</button><button id="bMod">Accès modérateur</button><button id="bTheme">Thème clair / sombre</button><p>Site de fans. Fic de VLT, tomes d'Avav, infos du WorldDoc des lecteurs.</p></div></aside>
<div id="page"><div id="top"><span id="crumb"></span><div class="search"><input id="q" type="search" placeholder="Chercher un personnage, un lieu, un Pokémon…" aria-label="Recherche" autocomplete="off"><div id="res"></div></div></div>
<main id="main"><p class="panel">Chargement…</p></main></div>
<div id="ov"></div><aside id="dr" role="dialog" aria-modal="true"></aside>
<div id="md" role="dialog" aria-modal="true"></div>
<div id="modbar"></div><div id="toast" role="status"></div>
<script>
"use strict";
let D=null,DEX={};
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fold=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const key=s=>fold(s).replace(/[^a-z0-9]/g,'');
const rich=s=>esc(s).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1">$1</a>');
const slug=s=>fold(s).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'x';
const TYC={Normal:'#8a8a66',Feu:'#d8632c',Eau:'#3f7fd6',Plante:'#4f9a3c','Électrik':'#b8920a',Glace:'#3d9fa3',Combat:'#b13a33',Poison:'#8e3f93',Sol:'#a8853a',Vol:'#7868c8',Psy:'#d6457a',Insecte:'#7f8c1c',Roche:'#8f7a2e',Spectre:'#5d4a85',Dragon:'#5a3ad6','Ténèbres':'#574338',Acier:'#6f6f8c','Fée':'#c4638b'};
const tyN=t=>{const f=key(t);for(const k in TYC)if(key(k)===f||(f==='electrique'&&k==='Électrik'))return k;return null};
const ty=t=>{const k=tyN(t);return `<span class="ty" style="background:${k?TYC[k]:'#667'}">${esc(k||t)}</span>`};
const VUES=[['accueil','Accueil','⌂'],['groupe','Le groupe principal','♞'],['carte','Carte interactive','⌖'],['arenes','Champions d\'arène','✪'],['personnages','Personnages','☺'],['organismes','Organismes','⚖'],['sectes','Sectes','✠'],['infos','Autres infos','❖'],['sommaire','Sommaire de la fic','☰'],['journal','Journal des modifications','✎']];
const pts=a=>a&&a.length?`<ul class="pts">${a.map(x=>`<li>${rich(x)}</li>`).join('')}</ul>`:'';
const lieu=id=>D.lieux.find(l=>l.id===id);
const parseTable=t=>{const r=(t||'').split('\n').filter(x=>x.trim()).map(l=>l.split(' | ').map(c=>c.trim()));return r.length?{cols:r[0],rows:r.slice(1)}:null};
const table=t=>{const p=parseTable(t);return p?`<div class="tblw"><table><tr>${p.cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>${p.rows.map(r=>`<tr>${p.cols.map((_,i)=>`<td>${rich(r[i]||'')}</td>`).join('')}</tr>`).join('')}</table></div>`:''};
const liens=t=>(t||'').split('\n').map(l=>l.split(' | ')).filter(l=>l[1]).map(([a,b])=>`<a class="btn sm" href="${esc(b.trim())}">↗ ${esc(a)}</a>`).join('');
const editB=(coll,id,label)=>`<button class="btn sm edit" data-edit="${coll}" data-id="${esc(id??'')}">✎ ${label||'Modifier'}</button>`;
const addB=(coll,label)=>`<button class="btn sm edit" data-add="${coll}">+ ${label}</button>`;

/* sprites */
function species(text){const out=[];const w=String(text||'').split(/[^A-Za-zÀ-ÿ0-9'-]+/);for(const x of w){const k=key(x);if(k.length>2&&DEX[k]){if(!out.includes(DEX[k]))out.push(DEX[k])}else if(x.includes('-'))for(const y of x.split('-')){const j=key(y);if(j.length>2&&DEX[j]&&!out.includes(DEX[j]))out.push(DEX[j])}}return out}
const isPair=t=>{const m=String(t||'').match(/([A-Za-zÀ-ÿ]{3,})-([A-Za-zÀ-ÿ]{3,})/);return !!m&&!DEX[key(m[0])]&&!!DEX[key(m[1])]&&!!DEX[key(m[2])]};
const sprImg=(id,c='')=>`<img class="${c}" src="sprites/${id}.png" alt="" loading="lazy" onerror="this.onerror=null;this.src='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png'">`;
function thumb(text,fusion){const ids=fusion&&fusion.length>1?fusion.flatMap(f=>species(f).slice(0,1)):species(text);
  if(ids.length>1&&((fusion&&fusion.length>1)||/usion| x | × /i.test(text)||isPair(text)))return `<span class="th fu">${sprImg(ids[0])}${sprImg(ids[1])}</span>`;
  return `<span class="th">${ids.length?sprImg(ids[0]):esc((String(text||'?').replace(/^[^A-Za-zÀ-ÿ?]+/,'')||'?')[0])}</span>`}
function capa(t){let out='',cur=null,fx=[];const flush=()=>{if(cur){out+=`<div class="cg"><span>${esc(cur.t)}</span><div class="mv">${cur.m.join('')}</div></div>`}};
  for(const l of String(t||'').split('\n')){const s=l.trim();if(!s)continue;if(s.startsWith('#')){flush();cur={t:s.replace(/^#+\s*/,''),m:[]};continue}
    if(!cur)cur={t:'Capacités',m:[]};const c=s.split(' | ').map(x=>x.trim());const k=tyN(c[1]||'');
    cur.m.push(`<span${c[3]?` title="${esc(c[3])}"`:''}>${k?`<i style="background:${TYC[k]}"></i>`:''}${esc(c[0])}${c[2]?` <em>${esc(c[2])}</em>`:''}${c[3]?' *':''}</span>`);if(c[3])fx.push(`<b>${esc(c[0])}</b> : ${esc(c[3])}`)}
  flush();return out+(fx.length?`<div class="fx">* ${fx.join('<br>* ')}</div>`:'')}
function pk(p){
  if(typeof p==='string')p={raw:p};
  if(p.raw!==undefined&&!p.esp)return `<div class="pk">${thumb(p.raw)}<div class="b"><span class="txt">${esc(p.raw)}</span></div></div>`;
  const l1=(p.nick?`<span class="nk">"${esc(p.nick)}"</span> `:'')+`<b>${p.delta?'delta-':''}${esc(p.esp)}</b>`;
  const props=Object.entries(p.props||{}).filter(([,v])=>v!=='').map(([k,v])=>k+' : '+v);
  const info=[p.talents?'Talents : '+p.talents:'',p.objet?'Objet : '+p.objet:'',...props].filter(Boolean).join(' · ');
  const part=[...(p.notes||[]),...(p.part||[])];
  const gout=[p.aime?'Aime : '+p.aime:'',p.naimepas?"N'aime pas : "+p.naimepas:'',p.lien?'Lien : '+p.lien:''].filter(Boolean);
  return `<div class="pk"${p.etat?' style="opacity:.8;border-style:dashed"':''}>${thumb(p.esp,p.fusion)}<div class="b"><div style="display:flex;gap:8px;align-items:baseline;flex-wrap:wrap"><span>${l1}</span><span class="lv">${[p.niveau?'Niv. '+esc(p.niveau):'',esc(p.etat||'')].filter(Boolean).join(' · ')}</span></div>${(p.fusion||[]).length?`<small>Fusion ${esc(p.fusion.join(' / '))}</small>`:''}
   ${(p.types||[]).length?`<div class="chips">${p.types.map(ty).join('')}</div>`:''}${p.role?`<small><b>${esc(p.role)}</b></small>`:''}${info?`<small>${esc(info)}</small>`:''}
   ${(p.moves||[]).length?`<div class="mv">${p.moves.map(m=>`<span>${esc(m)}</span>`).join('')}</div>`:''}${p.capacites?capa(p.capacites):''}${gout.length?`<small>${gout.map(esc).join('<br>')}</small>`:''}${part.length?`<small>${part.map(esc).join(' · ')}</small>`:''}</div></div>`}
const team=t=>t&&t.length?`<div class="stack">${t.map(pk).join('')}</div>`:'';
const avatar=(o,c)=>`<span class="av" style="--c:${c||o.couleur||''}" data-i="${esc((o.nom||'?').replace(/^[^A-Za-zÀ-ÿ?]+/,'')[0]||'?')}">${o.img?`<img src="${esc(o.img)}" alt="">`:esc((o.nom||'?').replace(/^[^A-Za-zÀ-ÿ?]+/,'')[0]||'?')}</span>`;

const GMAIN=()=>(D.groupe[0]&&D.groupe[0].groupe)||'Groupe principal';
const grpOf=g=>g.groupe||GMAIN();
const groupes=()=>[...new Set(D.groupe.map(grpOf))];
const mainG=()=>D.groupe.filter(g=>grpOf(g)===GMAIN());
const catsList=()=>{const base=(D.site.cats&&D.site.cats.length?D.site.cats:D.cats)||[];return [...base,...new Set(D.persos.map(p=>p.cat).filter(c=>c&&!base.includes(c)))]};
function blocks(t,tag){let out='',cur=null;const flush=()=>{if(cur&&cur.l.join('').trim())out+=tag==='panel'?`<section class="panel"><h3>${esc(cur.t)}</h3><div class="txt">${rich(cur.l.join('\n'))}</div></section>`:`<h4>${esc(cur.t)}</h4><div class="txt">${rich(cur.l.join('\n'))}</div>`};
  for(const l of String(t||'').split('\n')){if(/^#\s*\S/.test(l)){flush();cur={t:l.replace(/^#+\s*/,''),l:[]}}else{if(!cur)cur={t:'Autres',l:[]};cur.l.push(l)}}flush();return out}
/* tiroir */
let lastF=null;
function drawer(o){lastF=document.activeElement;const tabs=o.tabs.filter(t=>t.html);const dr=$('#dr');
  dr.innerHTML=`<div class="dh">${o.av}<div><small>${esc(o.over||'')}</small><h3>${esc(o.title)}</h3><small>${esc(o.sub||'')}</small>${o.edit||''}</div><button class="x" aria-label="Fermer">×</button></div>
  ${tabs.length>1?`<div class="dt">${tabs.map((t,i)=>`<button data-i="${i}">${esc(t.label)}</button>`).join('')}</div>`:''}<div class="db"></div>`;
  const show=i=>{$('.db',dr).innerHTML=tabs[i]?tabs[i].html:'';$('.db',dr).scrollTop=0;$$('.dt button',dr).forEach((b,j)=>b.classList.toggle('on',i===j))};show(0);
  $$('.dt button',dr).forEach(b=>b.onclick=()=>show(+b.dataset.i));$('.x',dr).onclick=closeDr;
  dr.classList.add('on');$('#ov').classList.add('on');document.body.classList.add('lock');$('.x',dr).focus()}
function closeDr(){$('#dr').classList.remove('on');$('#ov').classList.remove('on');document.body.classList.remove('lock');if(lastF&&lastF.isConnected)lastF.focus()}
$('#ov').onclick=closeDr;

const openGroupe=id=>go('groupe-'+id);
function pageGroupe(id){const g=D.groupe.find(x=>x.id===id);if(!g)return R.groupe();
  const comp=Object.entries(g.comp||{});const e=species(g.embleme)[0];
  const bars=comp.map(([k,v])=>{const n=parseInt(v);const neg=/-/.test(v);return `<div class="bar${neg?' neg':''}"><span>${esc(k)}</span><i style="--w:${isNaN(n)?30:Math.min(100,Math.abs(n)*20)}%"></i><b class="num">${esc(v)}</b></div>`}).join('');
  const sec=(t,a)=>a&&a.length?`<section class="panel"><h3>${t}</h3>${pts(a)}</section>`:'';
  return `<div class="crumbs"><span class="tag">${esc(grpOf(g))}</span>${D.groupe.filter(x=>grpOf(x)===grpOf(g)).map(x=>`<button class="who${x.id===g.id?' on':''}" data-v="groupe-${x.id}">${avatar(x)}${esc(x.nom)}</button>`).join('')}</div>
  <section class="hero2" style="--c:${g.couleur}">${avatar(g)}<div class="meta"><h2>${esc(g.nom)}</h2><div class="chips">${g.badges.map(ty).join('')||'<span class="chip">Aucun badge</span>'}${(g.defaites||[]).length?`<span class="chip">Défaites : ${g.defaites.map(esc).join(', ')}</span>`:''}</div>
   <div class="txt" style="color:var(--muted)">${g.infos.map(esc).join('\n')}</div><div>${editB('groupe',g.id)}</div></div>${e?`<span class="em" title="${esc(g.embleme)}">${sprImg(e)}</span>`:''}</section>
  ${(()=>{const right=`${comp.length?`<section class="panel"><h3>Compétences</h3><div class="stack">${bars}</div><p class="txt" style="color:var(--muted);margin-top:10px;font-size:14px">${esc(g.points)}</p></section>`:''}${sec('Traits particuliers',g.traits)}${sec('Atouts croisés',g.atouts)}${sec('Inventaire "important"',g.inventaire)}${sec('Gardiens',g.gardiens)}${sec('Notes à savoir en plus',g.notes)}${blocks(g.extras,'panel')}`;
    const teamP=`<section class="panel"><h3>Équipe Pokémon · ${g.equipe.length}</h3><div class="teamgrid">${g.equipe.map(pk).join('')}</div></section>`;
    return right?`<div class="split"><div class="stack">${teamP}${sec('Informations',g.bio)}</div><div class="stack">${right}</div></div>`:`${sec('Informations',g.bio)}${teamP}`})()}`}
function persoHtml(p){return `${pts(p.bio)}${blocks(p.extras)}${p.lieu&&lieu(p.lieu)?`<h4>Sur la carte</h4><div class="chips"><button class="chip" data-golieu="${p.lieu}">⌖ ${esc(lieu(p.lieu).nom)}</button></div>`:''}${(p.equipe||[]).length?`<h4>Pokémon</h4>${team(p.equipe)}`:''}`||'<p>Aucune information pour l\'instant.</p>'}
function openPerso(id){const p=D.persos.find(x=>x.id===id);if(!p)return;drawer({av:avatar(p),over:p.cat,title:p.nom,sub:p.sous,edit:editB('persos',p.id),tabs:[{label:'Fiche',html:persoHtml(p)||' '}]})}
function openMembre(si,mi){const s=D.sectes[si],m=s.membres[mi];drawer({av:avatar(m,s.couleur),over:s.nom,title:m.nom,sub:m.sous,edit:editB('sectes',s.id,'Modifier la secte'),tabs:[{label:'Fiche',html:persoHtml(m)||' '}]})}
const openArene=t=>go('arene-'+slug(t));
function pageArene(sl){const a=D.arenes.find(x=>slug(x.type)===sl);if(!a)return R.arenes();const l=a.ville&&lieu(a.ville);
  return `<div class="crumbs"><button class="chip" data-v="arenes">← Toutes les arènes</button>${D.arenes.map(x=>`<button class="ty" style="border:0;background:${TYC[x.type]||'#667'};opacity:${x===a?1:.55}" data-v="arene-${slug(x.type)}" title="${esc(x.champ)}">${esc(x.type)}</button>`).join('')}</div>
  <section class="hero2" style="--c:${TYC[a.type]||'#667'}">${avatar({nom:a.champ,img:a.img},TYC[a.type])}<div class="meta"><div>${ty(a.type)}</div><h2>${esc(a.champ)}</h2>
   <div class="chips">${l?`<button class="chip" data-golieu="${l.id}">⌖ ${esc(a.villeTxt||l.nom)}</button>`:`<span class="chip">${esc(a.villeTxt||'Ville inconnue')}</span>`}</div><div>${editB('arenes',a.type)}</div></div></section>
  <div class="split"><div class="stack">${(a.equipes||[]).length?a.equipes.map(e=>`<section class="panel"><h3>${esc(e.niveau)}</h3><div class="teamgrid">${e.pokemon.map(pk).join('')}</div></section>`).join(''):'<section class="panel"><h3>Équipe</h3><p style="color:var(--muted)">Équipe inconnue pour l\'instant.</p></section>'}</div>
  <div class="stack">${(a.infos||[]).length?`<section class="panel"><h3>Épreuve et service</h3>${pts(a.infos)}</section>`:''}${(a.notes||[]).length?`<section class="panel"><h3>Sur le champion</h3>${pts(a.notes)}</section>`:''}${blocks(a.extras,'panel')}
   <section class="panel"><h3>Badges du groupe</h3><div class="stack">${mainG().map(g=>`<button class="mini" data-v="groupe-${g.id}">${avatar(g)}<b>${esc(g.nom)}</b><span>${g.badges.some(b=>tyN(b)===a.type)?'<span class="tag add">Badge obtenu</span>':(g.defaites||[]).some(b=>tyN(b)===a.type)?'<span class="tag del">Défaite</span>':'<span style="color:var(--muted)">—</span>'}</span></button>`).join('')}</div></section></div></div>`}

/* vues */
const R={};
function people(){const o=[];
  D.groupe.forEach(g=>o.push({k:'g:'+g.id,nom:g.nom,sous:(g.infos||[])[0]||grpOf(g),cat:grpOf(g),img:g.img,c:g.couleur,t:(g.bio||[]).join(' ')}));
  D.persos.forEach(p=>o.push({k:'p:'+p.id,nom:p.nom,sous:p.sous,cat:p.cat,img:p.img,lieu:p.lieu,t:(p.bio||[]).join(' ')}));
  D.arenes.forEach(a=>{if(a.champ&&a.champ!=='?')o.push({k:'a:'+a.type,nom:a.champ,sous:'Arène '+a.type,cat:'Champions d\'arène',img:a.img,c:TYC[a.type],lieu:a.ville,t:(a.notes||[]).join(' ')})});
  D.sectes.forEach((s,i)=>s.membres.forEach((m,j)=>o.push({k:'s:'+i+':'+j,nom:m.nom,sous:m.sous,cat:s.nom,img:m.img,c:s.couleur,t:(m.bio||[]).join(' ')})));return o}
function openKey(k){const [a,b,c]=k.split(':');if(a==='g')openGroupe(b);else if(a==='p')openPerso(b);else if(a==='a')openArene(b);else openMembre(+b,+c)}
const pcard=p=>`<button class="pc" data-k="${esc(p.k)}">${avatar(p,p.c)}<b>${esc(p.nom)}</b><small>${esc(p.sous||'')}</small></button>`;
const epName=e=>/^[\d.]+$/.test(e)?'Épisode '+e:e;
function lastEp(){for(let i=D.arcs.length-1;i>=0;i--){const a=D.arcs[i];for(let j=a.segs.length-1;j>=0;j--){const e=epsParse(a.segs[j].eps);if(e.length)return{e:e[e.length-1],arc:a,seg:a.segs[j],n:D.arcs.reduce((n,x)=>n+x.segs.reduce((m,s)=>m+epsParse(s.eps).length,0),0)}}}return null}
R.accueil=()=>{const s=D.site,le=lastEp(),j=[...(D.journal||[])].reverse().slice(0,3);
  const T=[['carte','⌖','Carte interactive'],['arenes','✪','Champions d\'arène'],['personnages','☺','Personnages'],['organismes','⚖','Organismes'],['sectes','✠','Sectes'],['infos','❖','Autres infos'],['sommaire','☰','Sommaire']];
  return `<section class="panel hero"><div class="stack" style="gap:12px"><h2>${esc(s.titre)}</h2><p class="lead txt">${esc(s.lead)}</p><p class="txt" style="max-width:70ch">${esc(s.texte)}</p><p class="txt" style="color:var(--muted);max-width:70ch">${esc(s.aide)}</p>

      document.body.classList.remove('placing');$('#md').style.display='';document.body.classList.add('lock')},{once:true,capture:true})}});
function findDef(btn){const k=btn.dataset.subadd;let defs=SCH[FORM.coll].f;const chain=[];let n=btn.closest('.f');while(n){const s=n.querySelector(':scope > [data-sub]');if(s)chain.unshift(s.dataset.sub);n=n.parentElement&&n.parentElement.closest('.f')}

$('#md').addEventListener('change',e=>{const t=e.target;if(!t.dataset.up||!t.files[0])return;const file=t.files[0];const im=new Image();im.onload=()=>{const s=Math.min(im.width,im.height),c=document.createElement('canvas');c.width=c.height=Math.min(320,s);
  c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)*.3,s,s,0,0,c.width,c.height);const url=c.toDataURL('image/webp',.85);const path='portraits/'+slug(file.name.replace(/\.[^.]+$/,''))+'-'+Date.now().toString(36)+'.webp';
  uploads[path]=url.split(',')[1];$('#'+t.dataset.up).value=path;toast('Image prête : elle sera envoyée à l\'enregistrement.')};im.src=URL.createObjectURL(file)});
async function save(mode){const s=SCH[FORM.coll],err=$('#fErr'),msg=$('#fMsg').value.trim();if(!msg){err.textContent='Écrivez un court compte rendu de la modification.';$('#fMsg').focus();return}
  const val=mode==='del'?null:{...FORM.orig,...readFields($('#fRoot'))};
  if(val)s.f.forEach(d=>{if(d[2]==='sub')val[d[0]]=clean(val[d[0]])});
  if(val&&FORM.isNew&&s.idk==='id')delete val.id;
  const pos=$('#fPos')?Math.max(1,parseInt($('#fPos').value)||1)-1:null;const moved=!FORM.isNew&&!FORM.single&&pos!==null&&pos!==findIdx(FORM.coll,FORM.id);
  if(val&&s.idk==='id'&&!val.id){let id=slug(val[s.label]||'fiche'),n=2;while(D[FORM.coll].some(x=>x.id===id))id=slug(val[s.label])+'-'+n++;val.id=id}
  const champs=val?s.f.filter(d=>d[2]==='pos'?(val.x!==FORM.orig.x||val.y!==FORM.orig.y):nz(val[d[0]])!==nz(FORM.orig[d[0]])).map(d=>d[1].replace(/ \(.*/,'')):[];
  if(moved)champs.push('Position');
  if(mode!=='del'&&!FORM.isNew&&!champs.length){err.textContent='Rien n\'a été modifié.';return}
  err.textContent='Enregistrement…';$('#fSave').disabled=true;
  try{for(const p of Object.keys(uploads)){if(val&&JSON.stringify(val).includes(p))await gh(`/repos/${GH.repo}/contents/${p}`,{method:'PUT',body:JSON.stringify({message:'Image : '+p,content:uploads[p],branch:GH.branch||undefined})});delete uploads[p]}
    const f=await ghData(),N=f.data;
    if(FORM.single)N[FORM.coll]=val;else if(FORM.isNew)N[FORM.coll].splice(Math.min(pos??1e9,N[FORM.coll].length),0,val);
    else{const i=s.idk?N[FORM.coll].findIndex(x=>String(x[s.idk])===String(FORM.id)):FORM.id;if(i<0||!N[FORM.coll][i])throw new Error('Cette fiche a été supprimée entre-temps par quelqu\'un d\'autre.');if(mode==='del')N[FORM.coll].splice(i,1);else{N[FORM.coll][i]=val;if(moved){N[FORM.coll].splice(i,1);N[FORM.coll].splice(Math.min(pos,N[FORM.coll].length),0,val)}}}
    const cible=s.nom+(FORM.single?'':' › '+((val||FORM.orig)[s.label]||''));
    (N.journal=N.journal||[]).push({d:new Date().toISOString(),par:GH.login,action:mode==='del'?'suppr':FORM.isNew?'ajout':'modif',cible,champs,msg});
    await gh(`/repos/${GH.repo}/contents/data.json`,{method:'PUT',body:JSON.stringify({message:`${cible} — ${msg}`,content:b64e(JSON.stringify(N,null,1)),sha:f.sha,branch:GH.branch||undefined})});
    D=N;closeForm();closeDr();go(R[route]||/^(groupe|arene|info|org)-/.test(route)?route:'accueil');toast('Enregistré. Le site public se met à jour dans une minute environ.',6000)}
  catch(er){err.textContent=er.message==='Failed to fetch'?'Connexion à GitHub impossible.':er.message;$('#fSave').disabled=false}}
